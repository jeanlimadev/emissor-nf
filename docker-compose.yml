# Infraestrutura local do emissor: so o Postgres. A API roda com `dotnet run`
# apontando para ele (ConnectionStrings__Emissor em appsettings.Development.json).
services:
  postgres:
    image: postgres:17-alpine
    container_name: emissor-nf-postgres
    environment:
      POSTGRES_USER: emissor
      POSTGRES_PASSWORD: emissor
      POSTGRES_DB: emissor
    ports:
      - "127.0.0.1:5435:5432"
    volumes:
      - emissor-nf-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U emissor -d emissor"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  emissor-nf-pgdata:
